name: GitHub Pages

# The website in site/, published to https://dev7a.github.io/rdmalink/.
#
# Event flow: a pull request that touches the site builds and checks it and
# publishes nothing. A push to main that touches the site, this file or
# CHANGELOG.md (the page shows the newest released version), or a manual run
# on main, builds and checks it, uploads site/dist as this run's Pages
# artifact, and the deploy job hands that artifact to GitHub Pages. A manual
# run on any other branch only builds and checks. The github-pages
# environment allows only main; that rule, not the if: below, keeps any other
# ref from deploying. A CHANGELOG.md push deploys the new version when the
# version PR merges, before the release is published (docs/ARCHITECTURE.md).
#
# Tokens: the build job reads the repository and keeps no credential in
# .git/config; nothing in it can write. Only the deploy job can publish, with
# pages: write and id-token: write (the OIDC token deploy-pages exchanges for
# the deployment); it checks nothing out and runs no repository code. The
# build uses the runner's own python3, standard library only: no setup
# action, no pip, no download.
on:
  pull_request:
    paths: ['site/**', '.github/workflows/pages.yml', 'CHANGELOG.md']
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml', 'CHANGELOG.md']
  workflow_dispatch:

permissions: {}

# One run per ref at a time. A deploy in progress finishes; a newer run
# replaces one still waiting, so the latest commit is the one published.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and check the static site
        run: |
          set -euo pipefail
          python3 --version
          python3 site/build.py
          python3 site/check.py
      - name: Identify this build artifact
        id: artifact
        run: |
          set -euo pipefail
          echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
          name: ${{ steps.artifact.outputs.name }}

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
